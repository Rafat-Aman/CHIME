{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload to Google Drive</title>
<!-- <link rel="stylesheet" href="{% static 'drive_integration/css/uploads.css' %}"> -->
<link rel="stylesheet" href="{% static 'drive_integration/css/uploads.css' %}">

</head>
<body>
  {% csrf_token %}
  <div class="upload-container">
    <h1>Multi-Account Drive Upload</h1>

    <div class="account-section">
      <h3>Select Google Accounts</h3>
      {% if google_accounts %}
        {% for acc in google_accounts %}
          <label class="account-item">
            <input type="checkbox" name="account" value="{{ acc.id }}">
            {{ acc.extra_data.email|default:acc.uid }}
          </label>
        {% endfor %}
      {% else %}
        <p>No Google accounts linked.</p>
      {% endif %}
    </div>

    <div class="file-controls">
      <input type="file" id="fileInput">
      <input type="number" id="chunkSize" value="5" min="1"> MB
      <button id="uploadBtn" class="upload-btn">Start Upload</button>
    </div>

    <div id="progressContainer"></div>
  </div>

  <script>
    const CREATE_SESSION_URL = "{% url 'create_upload_session' %}";
    const PROXY_CHUNK_URL = "{% url 'proxy_resumable_chunk' %}";
  </script>
  <script src="{% static 'drive_integration/js/upload.js' %}"></script>
</body>
</html>
