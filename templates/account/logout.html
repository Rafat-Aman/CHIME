{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account · CHIME</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <style>
    /* === Account Menu Styling === */
    .account-container{
      max-width:600px;
      margin:80px auto;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px;
      box-shadow:var(--shadow);
    }
    .account-container h2{
      margin-top:0;
      font-size:1.6rem;
      margin-bottom:20px;
      text-align:center;
    }
    .account-menu{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:30px;
    }
    .account-menu a{
      background:#0f1726;
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text);
      text-decoration:none;
      padding:12px 16px;
      transition:background .2s ease;
    }
    .account-menu a:hover{
      background:#182236;
    }

    /* === Sign out section === */
    .signout-section{
      border-top:1px solid var(--border);
      padding-top:20px;
      text-align:center;
    }
    .signout-section p{
      color:var(--muted);
      margin-bottom:18px;
    }
    form{display:inline;}
    .btn-primary{
      background:var(--brand);
      color:#00122a;
      border:1px solid #5b9bff;
      border-radius:12px;
      padding:10px 16px;
      font-weight:600;
      cursor:pointer;
      transition:background .2s ease, transform .1s ease;
    }
    .btn-primary:hover{background:#70abff; transform:translateY(-1px);}
    .btn-outline{
      background:transparent;
      color:var(--text);
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 16px;
      text-decoration:none;
      margin-left:8px;
    }
    .btn-outline:hover{background:#0f1726;}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">CHIME</h1>
    </div>
  </header>

  <main class="container">
    <div class="account-container">
      <h2>Account Settings</h2>

      <nav class="account-menu">
        <a href="{% url 'account_email' %}">Change Email</a>
        <a href="{% url 'account_change_password' %}">Change Password</a>
        <a href="{% url 'socialaccount_connections' %}">Account Connections</a>
        <a href="{% url 'account_logout' %}">Sign Out</a>
      </nav>

      <div class="signout-section">
        <h3>Sign Out</h3>
        <p>Are you sure you want to sign out?</p>

        <form method="post" action="{% url 'account_logout' %}">
          {% csrf_token %}
          {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
          {% endif %}
          <button class="btn-primary" type="submit">Sign Out</button>
        </form>
        <a href="{% url 'account_dashboard' %}" class="btn-outline">Cancel</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </div>
      <div>&copy; 2025 CHIME</div>
    </div>
  </footer>
</body>
</html>
