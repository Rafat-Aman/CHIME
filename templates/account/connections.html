{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Change Password · CHIME</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <style>
    .account-container {
      max-width: 600px;
      margin: 80px auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
    }
    .account-container h2 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 20px;
    }
    .account-menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }
    .account-menu a {
      background: #0f1726;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      padding: 12px 16px;
      transition: background .2s ease;
    }
    .account-menu a:hover {
      background: #182236;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      background: #0f1726;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .helptext, ul.errorlist {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 4px 0 8px 0;
    }
    ul.errorlist { color: #ffaaaa; list-style: disc; padding-left: 20px; }

    .btn-primary {
      background: var(--brand);
      color: #00122a;
      border: 1px solid #5b9bff;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s ease, transform .1s ease;
    }
    .btn-primary:hover { background: #70abff; transform: translateY(-1px); }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      text-decoration: none;
      text-align: center;
    }
    .btn-outline:hover { background: #0f1726; }

    .note {
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">CHIME</h1>
    </div>
  </header>

  <main class="container">
    <div class="account-container">
      <h2>Change Password</h2>

      <!-- Account Menu -->
      <nav class="account-menu">
        <a href="{% url 'account_email' %}">Change Email</a>
        <a href="{% url 'account_change_password' %}" class="active">Change Password</a>
        <a href="{% url 'socialaccount_connections' %}">Account Connections</a>
        <a href="{% url 'account_logout' %}">Sign Out</a>
      </nav>

      <!-- Password Form -->
      <form method="post" action="{% url 'account_change_password' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn-primary" type="submit">Change Password</button>
      </form>

      <div class="note">
        <a href="{% url 'account_reset_password' %}">Forgot Password?</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </div>
      <div>&copy; 2025 CHIME</div>
    </div>
  </footer>
</body>
</html>
